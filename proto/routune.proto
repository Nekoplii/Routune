syntax = "proto3";

package routune;

service RoutuneControl {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc StreamTelemetry (TelemetryRequest) returns (stream AudioTelemetry);
  rpc GetHardwareOutputs (Empty) returns (DeviceList);
  rpc GetHardwareInputs (Empty) returns (DeviceList);
  rpc SetChannelRouting (RouteRequest) returns (RouteResponse);
  rpc SetEqBand (EqRequest) returns (Empty);
  rpc GetActiveApplications (Empty) returns (AppList);
  rpc RouteApplication (AppRouteRequest) returns (Empty);
  rpc ToggleAiNoise (AiNoiseRequest) returns (Empty);
  rpc SetAiNoise (AiNoiseRequest) returns (Empty);
  rpc SetNoiseGate (NoiseGateRequest) returns (Empty);
  rpc SetCompressor (CompressorRequest) returns (Empty);
  rpc SetChannelVolume (ChannelVolumeRequest) returns (Empty);
  rpc SetChannelMute (ChannelMuteRequest) returns (Empty);
  rpc SetSpatialAudio (SpatialAudioRequest) returns (Empty);
  rpc SetVolumeBoost (VolumeBoostRequest) returns (Empty);
  rpc GetDaemonConfig (Empty) returns (DaemonConfigResponse);
  rpc SetMicTest (MicTestRequest) returns (MicTestResponse);
  rpc GetMicTest (Empty) returns (MicTestResponse);
}

message MicTestRequest {
  bool enabled = 1;
}

message MicTestResponse {
  bool enabled = 1;
}

message Empty {}

message OutputDeviceInfo {
  string id = 1;
  string name = 2;
  string display_name = 3;
  uint32 channels = 4;
  uint32 sample_rate = 5;
}

message DeviceList {
  repeated OutputDeviceInfo devices = 1;
}

message RouteRequest {
  AudioChannel channel = 1;
  string target_hardware_device_name = 2;
}

message RouteResponse {
  bool success = 1;
  string message = 2;
  AudioChannel channel = 3;
  string active_device_name = 4;
}

message EqRequest {
  AudioChannel channel = 1;
  uint32 band_index = 2;
  float gain_db = 3;
}

enum AudioChannel {
  MASTER = 0;
  GAME = 1;
  CHAT = 2;
  MEDIA = 3;
  AUX = 4;
  MIC = 5;
}

message PingRequest {
  string client_id = 1;
}

message PingResponse {
  string message = 1;
  int64 timestamp_ms = 2;
  bool audio_active = 3;
}

message TelemetryRequest {
  uint32 target_fps = 1;
}

message ChannelVolumeMetric {
  AudioChannel channel = 1;
  string channel_name = 2;
  float peak_volume_db = 3;
  float rms_volume_db = 4;
  bool ai_noise_enabled = 5;
}

message SinkMetric {
  string sink_id = 1;
  string sink_name = 2;
  float peak_volume_db = 3;
  float rms_volume_db = 4;
}

message GraphNodeInfo {
  string id = 1;
  string name = 2;
  string node_type = 3;
  bool bypassed = 4;
  float peak_volume_db = 5;
  float rms_volume_db = 6;
}

message GraphEdgeInfo {
  string from_node = 1;
  string to_node = 2;
}

message GraphTopology {
  repeated GraphNodeInfo nodes = 1;
  repeated GraphEdgeInfo edges = 2;
}

message AudioTelemetry {
  float peak_volume_db = 1;
  float rms_volume_db = 2;
  repeated float spectrum = 3;
  uint64 sequence_number = 4;
  repeated SinkMetric sink_metrics = 5;
  GraphTopology topology = 6;
  repeated ChannelVolumeMetric channel_metrics = 7;
}

message AppStream {
  uint32 app_id = 1;
  string name = 2;
  string icon_name = 3;
  AudioChannel current_sink = 4;
  string current_sink_name = 5;
}

message AppList {
  repeated AppStream apps = 1;
}

message AppRouteRequest {
  uint32 app_id = 1;
  AudioChannel target_channel = 2;
}

message AiNoiseRequest {
  AudioChannel channel = 1;
  bool enabled = 2;
  float level = 3;
}

message NoiseGateConfig {
  bool enabled = 1;
  float threshold_db = 2;
  float attack_ms = 3;
  float release_ms = 4;
}

message CompressorConfig {
  bool enabled = 1;
  float threshold_db = 2;
  float ratio = 3;
  float attack_ms = 4;
  float release_ms = 5;
  float makeup_gain_db = 6;
}

message NoiseGateRequest {
  AudioChannel channel = 1;
  NoiseGateConfig config = 2;
}

message CompressorRequest {
  AudioChannel channel = 1;
  CompressorConfig config = 2;
}

message ChannelVolumeRequest {
  AudioChannel channel = 1;
  float volume_db = 2;
}

message ChannelMuteRequest {
  AudioChannel channel = 1;
  bool muted = 2;
}

enum SpatialAudioMode {
  HEADPHONE = 0;
  SPEAKER = 1;
}

message SpatialAudioConfig {
  bool enabled = 1;
  SpatialAudioMode mode = 2;
  float strength = 3;
}

message VolumeBoostConfig {
  bool enabled = 1;
  float boost_db = 2;
}

message SpatialAudioRequest {
  AudioChannel channel = 1;
  SpatialAudioConfig config = 2;
}

message VolumeBoostRequest {
  AudioChannel channel = 1;
  VolumeBoostConfig config = 2;
}

message ChannelConfigState {
  AudioChannel channel = 1;
  float volume_db = 2;
  bool muted = 3;
  string route_device = 4;
  repeated float eq_bands = 5;
  bool noise_cancellation = 6;
  NoiseGateConfig noise_gate = 7;
  CompressorConfig compressor = 8;
  float ai_noise_level = 9;
  SpatialAudioConfig spatial_audio = 10;
  VolumeBoostConfig volume_boost = 11;
}

message DaemonConfigResponse {
  repeated ChannelConfigState channels = 1;
}
