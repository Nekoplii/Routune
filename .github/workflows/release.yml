name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Package (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            protobuf-compiler

      - name: Run workspace unit tests
        run: cargo test --workspace

      - name: Build and package release archive
        run: ./scripts/package.sh

      - name: Build Tauri native bundles (.deb, .rpm, .AppImage)
        run: |
          cd routune-gui
          npx tauri build || true

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp dist/routune-linux-x86_64.tar.gz release-artifacts/
          cp dist/routune-linux-x86_64.tar.gz.sha256 release-artifacts/
          cp install.sh release-artifacts/
          
          # Collect Tauri native bundles if generated
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-artifacts/ \; 2>/dev/null || true

          cd release-artifacts
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
